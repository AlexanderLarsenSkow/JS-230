<!-- Skeleton or Scaffold for Creating HTML documents -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Listener Problem</title>
    <meta charset="utf-8">
    <style>
      .composer {
        background: #f5f5f5;
        padding:  1em;
        width:  30em;
      }

      .composer textarea {
        width: 100%;
        height: 4em;
      }

      .composer textarea.invalid {
        color: red;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const maxChars = 140;
        let textarea = document.querySelector('textarea');
        let p = document.querySelector('.counter');

        textarea.addEventListener('keyup', event => {
          let textLength = textarea.value.length;
          let remaining = maxChars - textLength;
          p.textContent = `${String(remaining)} characters remaining.`

          if (remaining < 0) {
            textarea.style.color = 'red';
          }
        });
      });
    </script>
  </head>
  <body>
    <div class="composer">
      <textarea placeholder="Enter your message"></textarea>
      <p class="counter"></p>
      <button type="submit">Post Message</button>
    </div>  </body>
</html>
