<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Car Filter</title>
    <meta charset="utf-8">
    <link href="smart.css" rel="stylesheet">
    <script src="smart.js"></script>
  </head>
  <body>
    <header>
      <h1>Buy Used Cars</h1>
      <form>
        <div class="options">
          <label for="make">Make:</label>
          <select id="make">
            <option>Any</option>
          </select>
          <label for="model">Model:</label>
          <select id="model">
            <option>Any</option>
          </select>
          <label for="price">Price:</label>
          <select id="price">
            <option>Any</option>
          </select>
          <label for="year">Year:</label>
          <select id="year">
            <option>Any</option>
          </select>
        </div>

        <button type="submit">Filter</button>
      </form>
    </header>
    <main>
      
    </main>
  </body>
</html>
