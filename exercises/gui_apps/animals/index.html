  <body>
    <header>
      <h1>Exotic Animals</h1>
    </header>
    <main>
      <figure>
        <img src="images/axolotl.jpg" alt="The salamander Axolotl is shown with a small smiley face.">
        <figcaption>The axolotl is a rare Mexican salamander known for its external gills and remarkable ability to regenerate limbs. Unlike most amphibians, it remains aquatic and retains its larval features into adulthood—a condition called neoteny. Found only in Lake Xochimilco, this smiling creature has become a symbol of conservation due to habitat loss and pollution, and it's popular in research for its regenerative abilities.</figcaption>
      </figure>

      <figure>
        <img src="images/fossa.jpeg" alt="A fossa is shown perched on a log in the forest.">
        <figcaption>Native to Madagascar, the fossa is a cat-like predator related to the mongoose. Agile and muscular, it can climb trees with ease, hunting lemurs and small mammals. It has retractable claws and sharp teeth, making it the island’s top carnivore. Though elusive, the fossa plays a crucial role in Madagascar's ecosystem. Its numbers are declining due to deforestation and habitat fragmentation.</figcaption>
      </figure>

      <figure>
        <img src="images/quokka.jpeg" alt="A quokka smiling with its arms out for a hug.">
        <figcaption>Often dubbed the “world’s happiest animal” for its cheeky grin, the quokka is a small marsupial found on Rottnest Island in Australia. Nocturnal and herbivorous, it thrives in shrubland habitats. Quokkas are friendly but vulnerable to predators like foxes and cats. Despite their cuteness, handling or feeding them is illegal. Their cheerful appearance has made them social media darlings, sparking conservation interest.</figcaption>
      </figure>

      <figure>
        <img src="images/pangolin.jpeg" alt="A pangolin is seen standing on the sand.">
        <figcaption>Covered in protective keratin scales, the pangolin is the world’s only truly scaly mammal. Native to Asia and Africa, it eats ants and termites using a long sticky tongue. When threatened, it curls into a ball. Unfortunately, pangolins are critically endangered due to illegal wildlife trade and habitat destruction. Their meat and scales are highly sought after in traditional medicine, making them the most trafficked mammal globally.</figcaption>
      </figure>

      <figure>
        <img src="images/okapi.jpeg" alt="A baby Okapi is seen posing for the camera.">
        <figcaption>Often called the “forest giraffe,” the okapi is a rare mammal native to the rainforests of the Democratic Republic of Congo. With zebra-like stripes on its hind legs and a giraffe-like body, it is shy and elusive. It uses its long, blue tongue to strip leaves from trees. Despite its giraffe relation, the okapi was unknown to science until the early 20th century.</figcaption>
      </figure>

      <figure>
        <img src="images/ayeaye.jpeg" alt="a Small bat-like animal perches on a branch.">
        <figcaption>The aye-aye is a nocturnal lemur from Madagascar, known for its eerie appearance and unique foraging behavior. It uses a long, skeletal middle finger to tap on wood and extract insects, similar to a woodpecker. With large eyes and bat-like ears, it has adapted perfectly for night hunting. Local folklore often associates it with bad luck, contributing to its threatened status due to human persecution.</figcaption>
      </figure>

      <figure>
        <img src="images/maned_wolf.jpeg" alt="a wolf with an orange mane stalks through the snow">
        <figcaption>The maned wolf, native to South America, resembles a red fox on stilts due to its long legs and reddish fur. Despite its appearance, it’s neither a fox nor a wolf. It’s a solitary omnivore, feeding on small mammals, fruits, and plants like the wolf apple. Its high-pitched roar-bark is used for communication. Habitat loss and road fatalities are major threats to this enigmatic creature.</figcaption>
      </figure>

      <figure>
        <img src="images/glass_frog.jpeg" alt="A tiny frog with glassy skin sits on a leaf">
        <figcaption>Glass frogs are small, arboreal amphibians native to Central and South America. Their translucent skin reveals internal organs, including a beating heart, giving them their name. They dwell in tropical rainforests near streams, where they lay eggs on leaves. These frogs are sensitive to environmental changes and deforestation. Their unique see-through appearance and delicate beauty make them a fascination among biologists and nature lovers alike.</figcaption>
      </figure>
    </main>
  </body>
