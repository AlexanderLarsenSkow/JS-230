<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Calculator App</title>
    <meta charset="utf-8">
    <script src="calc.js"></script>
    <link href="calc.css" rel="stylesheet">
  </head>
  <body>
    <div id="calculator">
      <div class="screen">
        <p class="operation"></p>
        <p class="entry-window">0</p>
      </div>
      <div class="buttons">
        <button id="ce" class="control">CE</button>
        <button id="c" class="control">C</button>
        <button id="neg" class="control">NEG</button>
        <button class="operator">/</button>
        <button class="digit">7</button>
        <button class="digit">8</button>
        <button class="digit">9</button>
        <button class="operator">x</button>
        <button class="digit">4</button>
        <button class="digit">5</button>
        <button class="digit">6</button>
        <button class="operator">-</button>
        <button class="digit">1</button>
        <button class="digit">2</button>
        <button class="digit">3</button>
        <button class="operator">+</button>
        <button class="digit">0</button>
        <button id="decimal" class="control">.</button>
        <button class="operator">%</button>
        <button id="solve">=</button>
      </div>
    </div>
  </body>
</html>
