<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Context Menu</title>
    <meta charset="utf-8">
    <link href="menu.css" rel="stylesheet">
    <script src="menu.js"></script>
  </head>
  <body>
    <header>
      <h1>Todos</h1>
    </header>
    <main>
      <div id="prompt">
        <p></p>
        <div id="confirm">
          <button class="delete">Yes</button>
          <button class="cancel">No</button>
        </div>
      </div>
      <div class="overlay"></div>
      <div class="context-menu">
        <button class="edit-menu">Edit Todo</button>
        <button class="details-menu">Show Details</button>
        <button class="delete-menu">Delete Todo</button>
      </div>
      <ul>
      </ul>
    </main>
  </body>
</html>
